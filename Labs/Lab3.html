<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Lab 3</title>

    <style>
        .image-preview img {
            border-style: solid;
            border-width: 30px;
            border-color: skyblue lightpink lightgreen #fefed5;
        }

        p > span {
            color: red;
        }

        #header span {
            color: pink;
        }

        span {
            color: green;
        }

        #header *:last-child {
            color: orange;
        }

        #header span:first-child:hover {
            color: blue;
        }

        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }

        th, td {
            padding: 8px;
        }
    </style>
</head>

<body>
